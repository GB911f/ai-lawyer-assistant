[project]
name = "jarvis-legal-agent-v1-qwen"
version = "1.0.0"
description = "Portfolio v1 of a legal assistant powered by local Qwen models through Ollama"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.13.3",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.27.2",
  "pdf2image>=1.17.0",
  "pydantic-settings>=2.6.0",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.2.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "pypdf>=5.0.0",
  "pytesseract>=0.3.13",
  "reportlab>=4.2.5",
  "sqlalchemy>=2.0.36",
  "sse-starlette>=2.1.3",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]
